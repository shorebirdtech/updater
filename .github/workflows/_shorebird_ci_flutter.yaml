# Generated by shorebird_ci --style static. Hand edits are reverted.
# Reusable workflow: CI steps for a single Flutter package.
on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      package_path:
        required: true
        type: string
      flutter_version:
        required: false
        default: ""
        type: string
      has_integration_tests:
        required: false
        default: false
        type: boolean
      has_unit_tests:
        required: false
        default: true
        type: boolean
      subpackages:
        required: false
        default: ""
        type: string
      runners:
        required: false
        default: '["ubuntu-latest"]'
        type: string
      min_coverage:
        required: false
        default: ""
        type: string
      coverage_excludes:
        required: false
        default: ""
        type: string
      total_shards:
        required: false
        default: 1
        type: number
      shard_index:
        required: false
        default: 0
        type: number

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || inputs.runners) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Flutter
        shell: bash
        env:
          FLUTTER_VERSION: ${{ inputs.flutter_version || '' }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            macOS) os=macos ;;
            Windows) os=windows ;;
            *) echo "::error::No Flutter release for $RUNNER_OS"; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::No Flutter release for $RUNNER_ARCH"; exit 1 ;;
          esac
          base=https://storage.googleapis.com/flutter_infra_release/releases
          # Releases from before arm64 builds have no dart_sdk_arch: x64.
          release=$(curl -fsSL --retry 5 "$base/releases_$os.json" | jq -c \
            --arg version "$FLUTTER_VERSION" --arg arch "$arch" '
              .current_release.stable as $stable
              | [.releases[]
                  | select(if $version == ""
                      then .hash == $stable and .channel == "stable"
                      else (.version | ltrimstr("v")) == $version end)
                  | select((.dart_sdk_arch // "x64") == $arch)
                ][0] // empty')
          if [ -z "$release" ]; then
            echo "::error::No Flutter release '${FLUTTER_VERSION:-stable}' for $os/$arch"
            exit 1
          fi
          archive="$RUNNER_TEMP/$(basename "$(jq -r .archive <<<"$release")")"
          curl -fsSL --retry 5 -o "$archive" "$base/$(jq -r .archive <<<"$release")"
          sum="$(jq -r .sha256 <<<"$release")  $archive"
          if command -v sha256sum >/dev/null; then
            sha256sum -c - <<<"$sum"
          else
            shasum -a 256 -c - <<<"$sum"
          fi
          case "$archive" in
            *.zip) unzip -q -o "$archive" -d "$RUNNER_TEMP" ;;
            *) tar -xf "$archive" -C "$RUNNER_TEMP" ;;
          esac
          rm "$archive"
          # GITHUB_PATH and GITHUB_ENV take native paths: pwd -W gives them on Windows.
          root=$(cd "$RUNNER_TEMP/flutter" && (pwd -W 2>/dev/null || pwd))
          echo "FLUTTER_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
          if [ "$os" = windows ]; then
            echo "$LOCALAPPDATA\Pub\Cache\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fi
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Install Dependencies
        working-directory: ${{ inputs.package_path }}
        env:
          SUBPACKAGES: ${{ inputs.subpackages }}
        run: |
          flutter pub get --no-example
          for sub in $SUBPACKAGES; do
            flutter pub get --no-example -C "$sub"
          done
      - working-directory: ${{ inputs.package_path }}
        run: |
          dart format --set-exit-if-changed .
          if [ -d routes/.well-known ]; then
            dart format --set-exit-if-changed routes/.well-known
          fi
      - working-directory: ${{ inputs.package_path }}
        run: |
          flutter analyze .
          if [ -d routes/.well-known ]; then
            flutter analyze routes/.well-known
          fi
      - name: Run Tests
        if: inputs.has_unit_tests
        working-directory: ${{ inputs.package_path }}
        env:
          MIN_COVERAGE: ${{ inputs.min_coverage }}
          RUNNER_OS_NAME: ${{ matrix.os }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          TOTAL_SHARDS: ${{ inputs.total_shards }}
        run: |
          set -f
          files=$(find test -name '*_test.dart' | sort | awk -v n="${TOTAL_SHARDS:-1}" -v i="${SHARD_INDEX:-0}" 'NR % n == i')
          if [ -z "$files" ]; then
            exit 0
          fi
          # A suite whose VM service connection drops as it loads fails every
          # suite running alongside it:
          # https://github.com/dart-lang/native/issues/3738
          retry_test() {
            set -o pipefail
            local log attempt
            log=$(mktemp)
            for attempt in 1 2; do
              if [ "$attempt" -gt 1 ]; then
                echo "::warning::a suite died loading, so the tests run again"
              fi
              if flutter test "$@" 2>&1 | tee "$log"; then
                return 0
              fi
              grep -q 'Failed to load' "$log" || return 1
              grep -q 'Connection closed before full header was received' "$log" || return 1
            done
            return 1
          }
          export -f retry_test
          if [ -n "$MIN_COVERAGE" ] && [ "$MIN_COVERAGE" != "0" ] && [ "$RUNNER_OS_NAME" = "ubuntu-latest" ]; then
            COVERAGE_DIR="$(pwd -W 2>/dev/null || pwd)/coverage"
            printf '%s\n' "$files" | xargs -n 50 bash -c 'retry_test "$@"' _ --coverage --merge-coverage --coverage-path="$COVERAGE_DIR/lcov.info"
          else
            printf '%s\n' "$files" | xargs -n 50 bash -c 'retry_test "$@"' _
          fi
      - name: Check Coverage
        if: inputs.has_unit_tests && inputs.min_coverage != '' && inputs.min_coverage != '0' && matrix.os == 'ubuntu-latest'
        working-directory: ${{ inputs.package_path }}
        env:
          EXCLUDES: ${{ inputs.coverage_excludes }}
          MIN_COVERAGE: ${{ inputs.min_coverage }}
        run: |
          dart pub global activate shorebird_ci 0.3.4
          shorebird_ci check_coverage coverage/lcov.info --min "$MIN_COVERAGE" --exclude "$EXCLUDES"
      - name: Integration Tests
        if: inputs.has_integration_tests
        working-directory: ${{ inputs.package_path }}
        run: |
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            macOS) platform=macos ;;
            Windows) platform=windows ;;
            *) platform= ;;
          esac
          if [ -z "$platform" ]; then
            echo "::notice::Skipping integration tests: Flutter has no desktop device on a $RUNNER_OS runner."
            exit 0
          fi
          if [ ! -d "$platform" ]; then
            echo "::notice::Skipping integration tests: the package has no $platform/ directory to build on this $RUNNER_OS runner."
            exit 0
          fi
          if [ "$platform" = linux ]; then
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
            xvfb-run -a flutter test integration_test -d linux
          else
            flutter test integration_test -d "$platform"
          fi
