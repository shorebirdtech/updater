name: build_patch_artifacts

# Releases in this repo are immutable: once published, a release's assets
# can't be added or replaced. So pushing a patch-v* tag creates a draft
# release, every job uploads its binary to the draft, and the draft is
# published only after all uploads succeed.
#
# To release: git tag patch-vX.Y.Z && git push origin patch-vX.Y.Z
# If an upload fails, use "Re-run failed jobs"; the draft is reused.
# Don't publish a patch release from the UI: it would have no binaries,
# and an immutable release's tag can never be reused.

permissions:
  contents: write

on:
  push:
    tags:
      - "patch-v*"

jobs:
  create-draft:
    runs-on: ubuntu-latest
    name: 📝 Create Draft Release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --verify-tag --title "patch ${TAG#patch-v}" --generate-notes

  upload-artifacts:
    needs: create-draft
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    name: 🦀 Upload Artifacts

    defaults:
      run:
        shell: bash

    env:
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # zstd-sys compiles C; for a musl target the cc crate looks for
      # musl-gcc.
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      # Stripping comes from Cargo.toml's [profile.release].
      - name: Build
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --bin patch --target "$TARGET"

      # The zip holds the binary alone, at its root: the CLI extracts it
      # as is (shorebird_cli's PatchArtifact).
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="$GITHUB_WORKSPACE/patch-$TARGET.zip"
          cd "target/$TARGET/release"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "$archive" patch.exe
          else
            zip "$archive" patch
          fi
          gh release upload "$TAG" "$archive" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: upload-artifacts
    runs-on: ubuntu-latest
    name: 🚀 Publish Release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Publishing can't be undone, so check every binary is there first.
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name | select(endswith(".zip"))] | length')
          if [ "$count" != 4 ]; then
            echo "Expected 4 zips on the draft, found $count" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
