# Generated by shorebird_ci --style static. Safe to edit.
# Run `shorebird_ci verify` to check for dep graph drift.
name: Shorebird CI

# A new push to a PR cancels that PR's run still going on the older head.
# Other events (push to main, merge_group) group by run id, so they never
# cancel or queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's changed files through the API.
      pull-requests: read
    outputs:
      shorebird_code_push: ${{ steps.filter.outputs.shorebird_code_push }}
      shorebird_code_push_example: ${{ steps.filter.outputs.shorebird_code_push_example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so dorny/paths-filter can diff on push events.
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub global activate shorebird_ci 0.3.0
      - name: Verify CI coverage
        run: shorebird_ci verify
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event.merge_group.base_ref || '' }}
          filters: |
            shorebird_code_push:
              - shorebird_code_push/**
            shorebird_code_push_example:
              - shorebird_code_push/**
              - shorebird_code_push/example/**

  shorebird_code_push:
    needs: changes
    if: needs.changes.outputs.shorebird_code_push == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: shorebird_code_push
      package_path: shorebird_code_push
      has_unit_tests: true
      subpackages: "example"
      flutter_version: ""
      has_integration_tests: false

  shorebird_code_push_example:
    needs: changes
    if: needs.changes.outputs.shorebird_code_push_example == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: shorebird_code_push_example
      package_path: shorebird_code_push/example
      has_unit_tests: false
      subpackages: ""
      flutter_version: ""
      has_integration_tests: false

  cspell:
    name: CSpell
    runs-on: ubuntu-latest
    # npx installs cspell's dependencies unpinned, so the job gets a
    # read-only token and checkout doesn't leave it in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - run: npx --yes cspell@10.4.0 --config cspell.config.yaml --no-progress "**"

  required:
    name: required
    if: ${{ !cancelled() }}
    needs:
      - changes
      - shorebird_code_push
      - shorebird_code_push_example
      - cspell
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were skipped because nothing changed)."

